<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | Dry Oar Rafting</title>
  <meta name="description" content="Contact Dry Oar Rafting for questions, reservations, or feedback.">
  <meta name="author" content="Tshibangu Mukadi">

  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header>
  <img src="images/logo.png" alt="Dry Oar Rafting Logo">

  <nav>
    <a href="index.html" style="color:#ffffff;">Home</a>
    <a href="about.html" style="color:#ffffff;">About Us</a>
    <a href="trips.html" style="color:#ffffff;">Trips</a>
    <a href="contact.html" class="active" style="color:#ffffff;">Contact Us</a>
  </nav>
</header>

<main>

  <!-- CONTACT INFO -->
  <section>
    <h2>Contact Information</h2>

    <p><strong>Address:</strong> 123 River Road, Adventure City</p>
    <p><strong>Phone:</strong> +1 (123) 456-7890</p>
    <p><strong>Email:</strong> info@dryoar.com</p>

    <!-- Google Map -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!..."
      width="600"
      height="450"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </section>

  <!-- EMPLOYEES -->
  <section>
    <h2>Our Team</h2>

    <figure>
      <img src="images/employee1.jpg" alt="Employee 1">
      <figcaption>John - Guide</figcaption>
    </figure>

    <figure>
      <img src="images/employee2.jpg" alt="Employee 2">
      <figcaption>Sarah - Manager</figcaption>
    </figure>

    <figure>
      <img src="images/employee3.jpg" alt="Employee 3">
      <figcaption>Mike - Safety Expert</figcaption>
    </figure>
  </section>

  <!-- CONTACT FORM -->
  <section>
    <h2>Send Us a Message</h2>

    <form>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <p>Purpose of Message:</p>

      <label>
        <input type="radio" name="purpose" value="general" required>
        General Inquiry
      </label>

      <label>
        <input type="radio" name="purpose" value="reservation">
        Reservation Question
      </label>

      <label>
        <input type="radio" name="purpose" value="suggestion">
        Website Suggestion
      </label>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <label>
        <input type="checkbox" name="subscribe">
        Please subscribe me to the monthly newsletter
      </label>

      <button type="submit">Send Message</button>

    </form>
  </section>

</main>

<footer>
  <p>© 2026 | Dry Oar Rafting | Tshibangu Mukadi</p>

  <nav class="socialmedia">
    <a href="https://www.facebook.com" target="_blank">
      <img src="images/facebook.png" alt="Facebook">
    </a>

    <a href="https://www.twitter.com" target="_blank">
      <img src="images/twitter.png" alt="Twitter">
    </a>

    <a href="https://www.instagram.com" target="_blank">
      <img src="images/instagram.png" alt="Instagram">
    </a>
  </nav>
</footer>

</body>
</html>
