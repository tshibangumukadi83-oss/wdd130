<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Rafting</title>
    <meta name="description" content="Contact Dry Oar Rafting for questions, reservations, or feedback about our white water rafting trips.">
    <meta name="author" content="Tshibangu Mukadi">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Dry Oar Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Dry Oar Rafting</h1>

        <section class="contact-info">
            <div class="info-box">
                <h2>Our Location</h2>
                <p><strong>Address:</strong> 123 River Road, Stanley, ID 83278</p>
                <p><strong>Phone:</strong> +1 (123) 456-7890</p>
                <p><strong>Email:</strong> info@dryoar.com</p>
            </div>
            <div class="map-box">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2867.755452243455!2d-114.93816202341624!3d44.21175641676662!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54af0926839a8c6d%3A0x2f11181f969b8296!2sStanley%2C%20ID%2083278%2C%20USA!5e0!3m2!1sen!2s!4v1710000000000" 
                    width="600" 
                    height="450" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="John, Lead River Guide">
                    <figcaption><strong>John</strong> - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Sarah, Trip Manager">
                    <figcaption><strong>Sarah</strong> - Trip Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Mike, Safety Expert">
                    <figcaption><strong>Mike</strong> - Safety Expert</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div class="form-item">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>
                    <label><input type="radio" id="general" name="purpose" value="general" required> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label>
                        <input type="checkbox" id="subscribe" name="subscribe"> Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 | Dry Oar Rafting | Tshibangu Mukadi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png" alt="Facebook icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png" alt="Twitter icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram icon"></a>
        </nav>
    </footer>
</body>
</html>
